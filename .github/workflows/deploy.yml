name: Deploy Backend

on:
  push:
    branches:
      - hom

jobs:
  build-and-deploy:
    name: Build and Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/jazida-backend:latest ./
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/jazida-backend:latest

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          script: |
            cd /opt/jazida-backend
            docker-compose down || true
            docker rm -f jazida_backend || true
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/jazida-backend:latest
            docker-compose up -d --force-recreate
