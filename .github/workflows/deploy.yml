name: Deploy Jazida Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build and Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: majorssolutions
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t majorssolutions/jazida-pokemon-backend:latest ./
          docker push majorssolutions/jazida-pokemon-backend:latest

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/jazida-backend
            docker-compose down || true
            docker rm -f jazida_backend || true
            docker rm -f jazida_db || true
            docker volume prune -f
            docker pull majorssolutions/jazida-pokemon-backend:latest
            docker-compose up -d --force-recreate

            # Espera o container subir e roda as migrações (se quiser)
            sleep 5
            docker exec jazida_backend npx knex migrate:latest --knexfile knexfile.js
